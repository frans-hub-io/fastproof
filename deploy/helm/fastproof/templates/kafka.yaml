{{- if eq (include "fastproof.kafkaBundled" .) "simple" }}
{{- $k := .Values.kafka.bundled.simple -}}
{{- $name := include "fastproof.kafkaName" . -}}
{{- $secret := include "fastproof.kafkaSimpleSecretName" . -}}
{{- $tls := not (empty $k.tls.existingSecret) -}}
{{- $mech := upper $k.saslMechanism -}}
{{- $host := printf "%s.%s.svc" $name .Release.Namespace -}}
{{- if not $k.credentials.existingSecret }}
{{- $prev := (lookup "v1" "Secret" .Release.Namespace $secret) | default dict }}
{{- $data := $prev.data | default dict }}
{{- $password := "" }}
{{- if hasKey $data "password" }}
{{- $password = index $data "password" | b64dec }}
{{- else }}
{{- $password = randAlphaNum 32 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secret }}
  labels:
    {{- include "fastproof.labels" . | nindent 4 }}
    app.kubernetes.io/component: kafka
type: Opaque
data:
  password: {{ $password | b64enc | quote }}
---
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "fastproof.labels" . | nindent 4 }}
    app.kubernetes.io/component: kafka
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels:
    {{- include "fastproof.labels" . | nindent 4 }}
    app.kubernetes.io/component: kafka
data:
  server.properties: |
    process.roles=broker,controller
    node.id=1
    controller.quorum.voters=1@127.0.0.1:9093
    controller.listener.names=CONTROLLER
    inter.broker.listener.name=INTERNAL
    listeners=CLIENT://0.0.0.0:9092,INTERNAL://127.0.0.1:9094,CONTROLLER://127.0.0.1:9093
    advertised.listeners=CLIENT://{{ $host }}:9092,INTERNAL://127.0.0.1:9094
    listener.security.protocol.map=CLIENT:{{ ternary "SASL_SSL" "SASL_PLAINTEXT" $tls }},INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
    sasl.enabled.mechanisms={{ $mech }}
    listener.name.client.sasl.enabled.mechanisms={{ $mech }}
    {{- if ne $mech "PLAIN" }}
    listener.name.client.{{ lower $mech }}.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required;
    {{- end }}
    {{- if $tls }}
    ssl.keystore.type=PEM
    ssl.keystore.location=/opt/kafka/runtime/keystore.pem
    ssl.truststore.type=PEM
    ssl.truststore.location=/etc/kafka/tls/ca.crt
    ssl.client.auth=none
    {{- end }}
    log.dirs=/var/lib/kafka/data
    num.partitions={{ .Values.kafka.topics.partitions }}
    default.replication.factor=1
    offsets.topic.replication.factor=1
    transaction.state.log.replication.factor=1
    transaction.state.log.min.isr=1
    auto.create.topics.enable=false
    log.retention.hours={{ $k.logRetentionHours }}
    {{- range $k.extraConfig }}
    {{ . }}
    {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "fastproof.labels" . | nindent 4 }}
    app.kubernetes.io/component: kafka
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: client
      port: 9092
      targetPort: client
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-headless
  labels:
    {{- include "fastproof.labels" . | nindent 4 }}
    app.kubernetes.io/component: kafka
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: client
      port: 9092
      targetPort: client
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "fastproof.labels" . | nindent 4 }}
    app.kubernetes.io/component: kafka
spec:
  replicas: 1
  serviceName: {{ $name }}-headless
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: kafka
        app.kubernetes.io/part-of: fastproof
        app.kubernetes.io/version: {{ $k.image.tag | quote }}
      annotations:
        checksum/config: {{ list $k .Values.kafka.topics | toJson | sha256sum }}
    spec:
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml $k.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: 60
      containers:
        - name: kafka
          image: {{ include "fastproof.imageRef" $k.image | quote }}
          imagePullPolicy: {{ $k.image.pullPolicy }}
          securityContext:
            {{- toYaml $k.securityContext | nindent 12 }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              cfg=/opt/kafka/runtime/server.properties
              cp /etc/kafka/config/server.properties "$cfg"
              {{- if eq $mech "PLAIN" }}
              printf 'listener.name.client.plain.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required user_%s="%s";\n' "$SASL_USERNAME" "$SASL_PASSWORD" >> "$cfg"
              {{- end }}
              {{- if $tls }}
              cat /etc/kafka/tls/tls.key /etc/kafka/tls/tls.crt > /opt/kafka/runtime/keystore.pem
              {{- end }}
              /opt/kafka/bin/kafka-storage.sh format --ignore-formatted -t "$CLUSTER_ID" -c "$cfg"{{ if ne $mech "PLAIN" }} --add-scram "{{ $mech }}=[name=${SASL_USERNAME},password=${SASL_PASSWORD}]"{{ end }}
              unset SASL_PASSWORD
              exec /opt/kafka/bin/kafka-server-start.sh "$cfg"
          env:
            - name: CLUSTER_ID
              value: {{ include "fastproof.kafkaClusterId" . | quote }}
            - name: KAFKA_HEAP_OPTS
              value: {{ $k.heapOpts | quote }}
            - name: LOG_DIR
              value: /tmp/kafka-logs
            - name: SASL_USERNAME
              value: {{ $k.username | quote }}
            - name: SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: {{ $k.credentials.key }}
          ports:
            - name: client
              containerPort: 9092
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: client
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: client
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: client
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml $k.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/kafka/config
              readOnly: true
            - name: runtime
              mountPath: /opt/kafka/runtime
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /var/lib/kafka
            {{- if $tls }}
            - name: tls
              mountPath: /etc/kafka/tls
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ $name }}
        - name: runtime
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        {{- if $tls }}
        - name: tls
          secret:
            secretName: {{ $k.tls.existingSecret }}
            defaultMode: 0440
        {{- end }}
        {{- if not $k.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
      {{- with $k.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $k.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $k.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if $k.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with $k.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ $k.persistence.size }}
  {{- end }}
{{- end }}
