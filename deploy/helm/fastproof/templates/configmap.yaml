{{- $backend := include "fastproof.blobBackend" . -}}
{{- $o := .Values.oidc -}}
{{- $i := .Values.integrations -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fastproof.fullname" . }}
  labels:
    {{- include "fastproof.labels" . | nindent 4 }}
data:
  FASTPROOF_LISTEN: "0.0.0.0:8080"
  FASTPROOF_OPS_LISTEN: "0.0.0.0:9090"
  {{- with .Values.publicUrl }}
  FASTPROOF_PUBLIC_URL: {{ . | quote }}
  {{- end }}
  FASTPROOF_DATABASE_URL_FILE: /etc/fastproof/secrets/database-url
  FASTPROOF_DATABASE_MAX_CONNECTIONS: {{ .Values.database.maxConnections | quote }}
  FASTPROOF_DATABASE_STATEMENT_TIMEOUT_SECONDS: {{ .Values.database.statementTimeoutSeconds | int64 | quote }}
  FASTPROOF_DATABASE_CONNECT_TIMEOUT_SECONDS: {{ .Values.database.connectTimeoutSeconds | int64 | quote }}
  {{- if gt (int .Values.database.ingestReserve) 0 }}
  FASTPROOF_DATABASE_INGEST_RESERVE: {{ .Values.database.ingestReserve | int64 | quote }}
  {{- end }}
  {{- if include "fastproof.databaseCa" . }}
  FASTPROOF_DATABASE_CA_FILE: /etc/fastproof/ca/database.crt
  {{- end }}
  {{- with include "fastproof.databaseSslMode" . }}
  PGSSLMODE: {{ . | quote }}
  {{- end }}
  FASTPROOF_BLOB_BACKEND: {{ $backend | quote }}
  {{- if eq $backend "fs" }}
  FASTPROOF_BLOB_DIR: /var/lib/fastproof/blobs
  {{- else }}
  {{- if include "fastproof.garageEnabled" . }}
  FASTPROOF_S3_ENDPOINT: {{ printf "http://%s:3900" (include "fastproof.garageName" .) | quote }}
  FASTPROOF_S3_REGION: {{ .Values.garage.region | quote }}
  FASTPROOF_S3_BUCKET: {{ .Values.garage.bucket | quote }}
  FASTPROOF_S3_PATH_STYLE: "true"
  {{- else }}
  FASTPROOF_S3_ENDPOINT: {{ .Values.blob.s3.endpoint | quote }}
  FASTPROOF_S3_REGION: {{ .Values.blob.s3.region | quote }}
  FASTPROOF_S3_BUCKET: {{ .Values.blob.s3.bucket | quote }}
  FASTPROOF_S3_PATH_STYLE: {{ .Values.blob.s3.pathStyle | quote }}
  {{- if or .Values.blob.s3.ca.existingSecret .Values.blob.s3.ca.existingConfigMap }}
  FASTPROOF_S3_CA_FILE: /etc/fastproof/ca/s3.crt
  {{- end }}
  {{- end }}
  FASTPROOF_S3_ACCESS_KEY_FILE: /etc/fastproof/secrets/s3-access-key
  FASTPROOF_S3_SECRET_KEY_FILE: /etc/fastproof/secrets/s3-secret-key
  {{- end }}
  FASTPROOF_SPOOL_DIR: /tmp/fastproof
  FASTPROOF_MEDIA_URL_TTL_SECONDS: {{ .Values.server.mediaUrlTtlSeconds | int64 | quote }}
  FASTPROOF_MAX_UPLOAD_BYTES: {{ .Values.server.maxUploadBytes | int64 | quote }}
  FASTPROOF_INGEST_WORKERS: {{ .Values.server.ingestWorkers | quote }}
  FASTPROOF_RETAIN_UPLOADS: {{ .Values.server.retainUploads | quote }}
  FASTPROOF_OUTBOX_RETENTION_DAYS: {{ .Values.server.outboxRetentionDays | quote }}
  FASTPROOF_LOG_MAX_LINE_BYTES: {{ .Values.server.logs.maxLineBytes | int64 | quote }}
  FASTPROOF_SSE_MAX_PER_CALLER: {{ .Values.server.guards.sseMaxPerCaller | int64 | quote }}
  FASTPROOF_SSE_RECHECK_SECONDS: {{ .Values.server.guards.sseRecheckSeconds | int64 | quote }}
  FASTPROOF_HEAVY_QUERIES_PER_CALLER: {{ .Values.server.guards.heavyQueriesPerCaller | int64 | quote }}
  FASTPROOF_MAX_CONCURRENT_SPOOLS: {{ .Values.server.guards.maxConcurrentSpools | int64 | quote }}
  FASTPROOF_BODY_IDLE_TIMEOUT_SECONDS: {{ .Values.server.guards.bodyIdleTimeoutSeconds | int64 | quote }}
  FASTPROOF_LOG_MAX_LINES_PER_REQUEST: {{ .Values.server.logs.maxLinesPerRequest | int64 | quote }}
  FASTPROOF_LOG_MAX_REQUEST_BYTES: {{ .Values.server.logs.maxRequestBytes | int64 | quote }}
  FASTPROOF_LOG_MAX_BYTES_PER_LAUNCH: {{ .Values.server.logs.maxBytesPerLaunch | int64 | quote }}
  FASTPROOF_INGEST_MODE: {{ .Values.ingest.mode | quote }}
  FASTPROOF_SEARCH_BACKEND: {{ .Values.search.backend | quote }}
  FASTPROOF_SINKS: {{ include "fastproof.sinks" . | quote }}
  {{- if include "fastproof.kafkaMode" . }}
  FASTPROOF_KAFKA_BROKERS: {{ include "fastproof.kafkaBrokers" . | quote }}
  FASTPROOF_KAFKA_TLS: {{ ternary "true" "false" (not (empty (include "fastproof.kafkaTls" .))) | quote }}
  {{- if include "fastproof.kafkaCa" . }}
  FASTPROOF_KAFKA_CA_FILE: /etc/fastproof/ca/kafka.crt
  {{- end }}
  {{- with include "fastproof.kafkaSasl" . }}
  {{- $k := . | fromJson }}
  FASTPROOF_KAFKA_SASL_MECHANISM: {{ $k.mechanism | quote }}
  FASTPROOF_KAFKA_USERNAME: {{ $k.username | quote }}
  FASTPROOF_KAFKA_PASSWORD_FILE: /etc/fastproof/secrets/kafka-password
  {{- end }}
  FASTPROOF_KAFKA_TOPIC_PREFIX: {{ .Values.kafka.topics.prefix | quote }}
  FASTPROOF_KAFKA_CREATE_TOPICS: {{ include "fastproof.createTopics" . | quote }}
  FASTPROOF_KAFKA_PARTITIONS: {{ .Values.kafka.topics.partitions | quote }}
  FASTPROOF_KAFKA_REPLICATION: {{ .Values.kafka.topics.replication | int | quote }}
  FASTPROOF_KAFKA_TRUSTED_PRODUCERS: {{ .Values.kafka.trustedProducers | quote }}
  FASTPROOF_KAFKA_CLIENT_ID: {{ .Values.kafka.clientId | quote }}
  FASTPROOF_KAFKA_MAX_RECORD_BYTES: {{ .Values.kafka.maxRecordBytes | int64 | quote }}
  FASTPROOF_KAFKA_SIGNATURE_MAX_AGE_HOURS: {{ .Values.kafka.signatureMaxAgeHours | int64 | quote }}
  FASTPROOF_KAFKA_CONNECT_TIMEOUT_SECONDS: {{ .Values.kafka.connectTimeoutSeconds | int64 | quote }}
  FASTPROOF_KAFKA_FETCH_MAX_BYTES: {{ max (int64 .Values.kafka.consumer.fetchMaxBytes) (int64 .Values.kafka.maxRecordBytes) | quote }}
  FASTPROOF_KAFKA_MAX_INFLIGHT_BYTES: {{ max (int64 .Values.kafka.consumer.maxInflightBytes) (int64 .Values.kafka.consumer.fetchMaxBytes) (int64 .Values.kafka.maxRecordBytes) | quote }}
  FASTPROOF_KAFKA_BATCH_MAX_RECORDS: {{ .Values.kafka.consumer.batchMaxRecords | int64 | quote }}
  FASTPROOF_KAFKA_BATCH_MAX_BYTES: {{ .Values.kafka.consumer.batchMaxBytes | int64 | quote }}
  {{- end }}
  {{- if .Values.sinks.clickhouse.enabled }}
  {{- $c := include "fastproof.clickhouseConn" . | fromJson }}
  FASTPROOF_CLICKHOUSE_URL: {{ $c.url | quote }}
  FASTPROOF_CLICKHOUSE_DATABASE: {{ .Values.sinks.clickhouse.database | quote }}
  FASTPROOF_CLICKHOUSE_USER: {{ $c.user | quote }}
  FASTPROOF_CLICKHOUSE_PASSWORD_FILE: /etc/fastproof/secrets/clickhouse-password
  {{- if $c.ca }}
  FASTPROOF_CLICKHOUSE_CA_FILE: /etc/fastproof/ca/clickhouse.crt
  {{- end }}
  FASTPROOF_CLICKHOUSE_RAW_TTL_DAYS: {{ .Values.sinks.clickhouse.rawTtlDays | quote }}
  {{- end }}
  {{- if .Values.sinks.opensearch.enabled }}
  {{- $c := include "fastproof.opensearchConn" . | fromJson }}
  FASTPROOF_OPENSEARCH_URL: {{ $c.url | quote }}
  FASTPROOF_OPENSEARCH_USER: {{ $c.user | quote }}
  FASTPROOF_OPENSEARCH_PASSWORD_FILE: /etc/fastproof/secrets/opensearch-password
  {{- if $c.ca }}
  FASTPROOF_OPENSEARCH_CA_FILE: /etc/fastproof/ca/opensearch.crt
  {{- end }}
  FASTPROOF_OPENSEARCH_INDEX_PREFIX: {{ .Values.sinks.opensearch.indexPrefix | quote }}
  FASTPROOF_OPENSEARCH_RAW_TTL_DAYS: {{ .Values.sinks.opensearch.rawTtlDays | quote }}
  FASTPROOF_OPENSEARCH_REPLICAS: {{ .Values.sinks.opensearch.replicas | quote }}
  {{- end }}
  {{- if include "fastproof.sinks" . }}
  FASTPROOF_SINK_BATCH_SIZE: {{ .Values.sinks.batchSize | int64 | quote }}
  FASTPROOF_SINK_FLUSH_INTERVAL_MS: {{ .Values.sinks.flushIntervalMs | int64 | quote }}
  {{- end }}
  {{- if include "fastproof.accessEnabled" . }}
  FASTPROOF_ACCESS_FILE: /etc/fastproof/access/access.yaml
  {{- end }}
  {{- if include "fastproof.adminTokensEnabled" . }}
  FASTPROOF_ADMIN_TOKENS_FILE: /etc/fastproof/secrets/admin-tokens
  {{- end }}
  {{- if $o.issuer }}
  FASTPROOF_OIDC_ISSUER: {{ $o.issuer | quote }}
  FASTPROOF_OIDC_CLIENT_ID: {{ $o.clientId | quote }}
  FASTPROOF_OIDC_CLIENT_SECRET_FILE: /etc/fastproof/secrets/oidc-client-secret
  FASTPROOF_OIDC_REDIRECT_URL: {{ include "fastproof.oidcRedirectUrl" . | quote }}
  {{- with $o.scopes }}
  FASTPROOF_OIDC_SCOPES: {{ join " " . | quote }}
  {{- end }}
  {{- with $o.usernameClaim }}
  FASTPROOF_OIDC_USERNAME_CLAIM: {{ . | quote }}
  {{- end }}
  {{- with $o.groupsClaim }}
  FASTPROOF_OIDC_GROUPS_CLAIM: {{ . | quote }}
  {{- end }}
  {{- with $o.allowedAlgs }}
  FASTPROOF_OIDC_ALLOWED_ALGS: {{ join "," . | quote }}
  {{- end }}
  {{- with $o.apiAudience }}
  FASTPROOF_OIDC_API_AUDIENCE: {{ . | quote }}
  {{- end }}
  {{- with $o.allowedHosts }}
  FASTPROOF_OIDC_ALLOWED_HOSTS: {{ join "," . | quote }}
  {{- end }}
  {{- with $o.sessionTtl }}
  FASTPROOF_OIDC_SESSION_TTL: {{ . | quote }}
  {{- end }}
  {{- with $o.sessionIdle }}
  FASTPROOF_OIDC_SESSION_IDLE: {{ . | quote }}
  {{- end }}
  {{- with $o.cookieName }}
  FASTPROOF_OIDC_COOKIE_NAME: {{ . | quote }}
  {{- end }}
  {{- with $o.postLogoutRedirect }}
  FASTPROOF_OIDC_POST_LOGOUT_REDIRECT: {{ . | quote }}
  {{- end }}
  {{- if $o.insecureCookie }}
  FASTPROOF_OIDC_INSECURE_COOKIE: "true"
  {{- end }}
  {{- if or $o.ca.existingSecret $o.ca.existingConfigMap }}
  FASTPROOF_OIDC_CA_FILE: /etc/fastproof/ca/oidc.crt
  {{- end }}
  {{- end }}
  {{- if .Values.tls.existingSecret }}
  FASTPROOF_TLS_CERT_FILE: /etc/fastproof/tls/tls.crt
  FASTPROOF_TLS_KEY_FILE: /etc/fastproof/tls/tls.key
  {{- if or .Values.tls.clientCa.existingSecret .Values.tls.clientCa.existingConfigMap }}
  FASTPROOF_TLS_CLIENT_CA_FILE: /etc/fastproof/ca/tls-client.crt
  {{- end }}
  {{- end }}
  {{- with $i.egressAllow }}
  FASTPROOF_EGRESS_ALLOW: {{ join "," . | quote }}
  {{- end }}
  {{- if include "fastproof.secretsKey" . }}
  FASTPROOF_SECRETS_KEY_FILE: /etc/fastproof/secrets/secrets-key
  {{- end }}
  {{- with $i.smtp.url }}
  FASTPROOF_SMTP_URL: {{ . | quote }}
  FASTPROOF_SMTP_FROM: {{ $i.smtp.from | quote }}
  {{- if $i.smtp.username }}
  FASTPROOF_SMTP_USERNAME: {{ $i.smtp.username | quote }}
  FASTPROOF_SMTP_PASSWORD_FILE: /etc/fastproof/secrets/smtp-password
  {{- end }}
  {{- end }}
  {{- with $i.telegramApiUrl }}
  FASTPROOF_TELEGRAM_API_URL: {{ . | quote }}
  {{- end }}
  FASTPROOF_DELIVERY_MAX_ATTEMPTS: {{ $i.delivery.maxAttempts | quote }}
  FASTPROOF_DELIVERY_BACKOFF_SECONDS: {{ $i.delivery.backoffSeconds | quote }}
  FASTPROOF_METRICS_TOP_BRANCHES: {{ .Values.metrics.topBranches | quote }}
  FASTPROOF_LOG_FORMAT: {{ .Values.server.logFormat | quote }}
  RUST_LOG: {{ .Values.server.logFilter | quote }}
  FASTPROOF_UI: {{ ternary "on" "off" .Values.server.ui | quote }}
  {{- with .Values.otel.endpoint }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ . | quote }}
  {{- end }}
  {{- with .Values.otel.protocol }}
  OTEL_EXPORTER_OTLP_PROTOCOL: {{ . | quote }}
  {{- end }}
  OTEL_SERVICE_NAME: {{ .Values.otel.serviceName | quote }}
  {{- with .Values.otel.resourceAttributes }}
  OTEL_RESOURCE_ATTRIBUTES: {{ . | quote }}
  {{- end }}
{{- if and (include "fastproof.accessEnabled" .) (not .Values.auth.access.existingConfigMap) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fastproof.fullname" . }}-access
  labels:
    {{- include "fastproof.labels" . | nindent 4 }}
data:
  access.yaml: |
    {{- toYaml (dict "roles" .Values.auth.access.roles "bindings" .Values.auth.access.bindings) | nindent 4 }}
{{- end }}
