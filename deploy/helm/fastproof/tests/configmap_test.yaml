suite: configuration
templates:
  - templates/configmap.yaml
release:
  name: fp
  namespace: qa
values:
  - ../ci/minimal-fs-values.yaml
tests:
  - it: sets listeners, storage and limits
    documentIndex: 0
    asserts:
      - equal:
          path: data.FASTPROOF_LISTEN
          value: 0.0.0.0:8080
      - equal:
          path: data.FASTPROOF_OPS_LISTEN
          value: 0.0.0.0:9090
      - equal:
          path: data.FASTPROOF_BLOB_BACKEND
          value: fs
      - equal:
          path: data.FASTPROOF_BLOB_DIR
          value: /var/lib/fastproof/blobs
      - equal:
          path: data.FASTPROOF_MAX_UPLOAD_BYTES
          value: "1073741824"
      - equal:
          path: data.FASTPROOF_SPOOL_DIR
          value: /tmp/fastproof
      - equal:
          path: data.FASTPROOF_ADMIN_TOKENS_FILE
          value: /etc/fastproof/secrets/admin-tokens
      - notExists:
          path: data.FASTPROOF_OIDC_ISSUER

  - it: points the server at the bundled Garage
    documentIndex: 0
    set:
      garage.enabled: true
      blob.backend: s3
    asserts:
      - equal:
          path: data.FASTPROOF_S3_ENDPOINT
          value: http://fp-garage:3900
      - equal:
          path: data.FASTPROOF_S3_REGION
          value: garage
      - equal:
          path: data.FASTPROOF_S3_BUCKET
          value: fastproof
      - equal:
          path: data.FASTPROOF_S3_ACCESS_KEY_FILE
          value: /etc/fastproof/secrets/s3-access-key

  - it: renders every OIDC setting from values
    documentIndex: 0
    values:
      - ../ci/oidc-values.yaml
    set:
      database.existingSecret: ""
    asserts:
      - equal:
          path: data.FASTPROOF_OIDC_ISSUER
          value: https://idp.example.com/realms/qa
      - equal:
          path: data.FASTPROOF_OIDC_REDIRECT_URL
          value: https://fastproof.example.com/auth/callback
      - equal:
          path: data.FASTPROOF_OIDC_CLIENT_SECRET_FILE
          value: /etc/fastproof/secrets/oidc-client-secret
      - equal:
          path: data.FASTPROOF_OIDC_SCOPES
          value: openid profile email
      - equal:
          path: data.FASTPROOF_OIDC_CA_FILE
          value: /etc/fastproof/ca/oidc.crt
      - equal:
          path: data.FASTPROOF_TLS_CLIENT_CA_FILE
          value: /etc/fastproof/ca/tls-client.crt
      - equal:
          path: data.FASTPROOF_ACCESS_FILE
          value: /etc/fastproof/access/access.yaml
      - equal:
          path: data.OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector.observability:4318

  - it: writes the access file from roles and bindings
    documentIndex: 1
    values:
      - ../ci/oidc-values.yaml
    set:
      database.existingSecret: ""
    asserts:
      - matchRegex:
          path: data["access.yaml"]
          pattern: "subject: group:qa"

  - it: configures the ReportPortal endpoint
    documentIndex: 0
    set:
      server.rp.settleMs: 500
      server.rp.launchIdleTimeout: 30m
      server.rp.maxInflight: 64
    asserts:
      - equal:
          path: data.FASTPROOF_RP_ENABLED
          value: "true"
      - equal:
          path: data.FASTPROOF_RP_SETTLE_MS
          value: "500"
      - equal:
          path: data.FASTPROOF_RP_ERROR_WAIT_MS
          value: "30000"
      - equal:
          path: data.FASTPROOF_RP_LAUNCH_IDLE_TIMEOUT
          value: 30m
      - equal:
          path: data.FASTPROOF_RP_MAX_REQUEST_BYTES
          value: "67108864"
      - equal:
          path: data.FASTPROOF_RP_MAX_INFLIGHT
          value: "64"
