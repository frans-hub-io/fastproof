{{- $fullname := include "fastproof.fullname" . -}}
{{- $ns := .Release.Namespace -}}
{{- if and .Values.database.url (not .Values.database.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-database
  labels:
    {{- include "fastproof.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-url: {{ .Values.database.url | quote }}
---
{{- end }}
{{- if .Values.postgresql.enabled }}
{{- $name := include "fastproof.postgresqlSecretName" . }}
{{- $prev := (lookup "v1" "Secret" $ns $name) | default dict }}
{{- $password := "" }}
{{- if and $prev.data (hasKey $prev.data "CUSTOM_PASSWORD") }}
{{- $password = index $prev.data "CUSTOM_PASSWORD" | b64dec }}
{{- else }}
{{- $password = randAlphaNum 32 }}
{{- end }}
{{- $user := .Values.postgresql.customUser.name }}
{{- $db := .Values.postgresql.customUser.database }}
{{- $host := include "fastproof.dependencyFullname" (dict "root" . "name" "postgresql") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "fastproof.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
type: Opaque
data:
  CUSTOM_USER: {{ $user | b64enc | quote }}
  CUSTOM_DB: {{ $db | b64enc | quote }}
  CUSTOM_PASSWORD: {{ $password | b64enc | quote }}
  database-url: {{ printf "postgres://%s:%s@%s:5432/%s" $user $password $host $db | b64enc | quote }}
---
{{- end }}
{{- if .Values.valkey.enabled }}
{{- $name := include "fastproof.valkeySecretName" . }}
{{- $prev := (lookup "v1" "Secret" $ns $name) | default dict }}
{{- $password := "" }}
{{- if and $prev.data (hasKey $prev.data "password") }}
{{- $password = index $prev.data "password" | b64dec }}
{{- else }}
{{- $password = randAlphaNum 32 }}
{{- end }}
{{- $host := include "fastproof.dependencyFullname" (dict "root" . "name" "valkey") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "fastproof.labels" . | nindent 4 }}
    app.kubernetes.io/component: valkey
type: Opaque
data:
  password: {{ $password | b64enc | quote }}
  url: {{ printf "redis://default:%s@%s:6379/0" $password $host | b64enc | quote }}
---
{{- end }}
{{- if and (eq .Values.blob.backend "s3") (not .Values.garage.enabled) (not .Values.blob.s3.credentials.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-s3
  labels:
    {{- include "fastproof.labels" . | nindent 4 }}
type: Opaque
stringData:
  access-key: {{ .Values.blob.s3.credentials.accessKey | quote }}
  secret-key: {{ .Values.blob.s3.credentials.secretKey | quote }}
---
{{- end }}
{{- if and .Values.garage.enabled (not .Values.garage.credentials.existingSecret) }}
{{- $name := include "fastproof.garageSecretName" . }}
{{- $prev := (lookup "v1" "Secret" $ns $name) | default dict }}
{{- $data := $prev.data | default dict }}
{{- $access := "" }}
{{- $secret := "" }}
{{- $rpc := "" }}
{{- if and (hasKey $data "access-key") (hasKey $data "secret-key") (hasKey $data "rpc-secret") }}
{{- $access = index $data "access-key" | b64dec }}
{{- $secret = index $data "secret-key" | b64dec }}
{{- $rpc = index $data "rpc-secret" | b64dec }}
{{- else }}
{{- $access = printf "GK%s" (randAlphaNum 48 | sha256sum | trunc 24) }}
{{- $secret = randAlphaNum 48 | sha256sum }}
{{- $rpc = randAlphaNum 48 | sha256sum }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "fastproof.labels" . | nindent 4 }}
    app.kubernetes.io/component: garage
type: Opaque
data:
  access-key: {{ $access | b64enc | quote }}
  secret-key: {{ $secret | b64enc | quote }}
  rpc-secret: {{ $rpc | b64enc | quote }}
---
{{- end }}
{{- if and (not .Values.auth.adminTokens.existingSecret) (or .Values.auth.adminTokens.tokens .Values.auth.adminTokens.generate) }}
{{- $name := printf "%s-admin-tokens" $fullname }}
{{- $lines := .Values.auth.adminTokens.tokens }}
{{- $bootstrap := "" }}
{{- if .Values.auth.adminTokens.generate }}
{{- $prev := (lookup "v1" "Secret" $ns $name) | default dict }}
{{- if and $prev.data (hasKey $prev.data "bootstrap-token") }}
{{- $bootstrap = index $prev.data "bootstrap-token" | b64dec }}
{{- else }}
{{- $bootstrap = printf "fpb_%s" (randAlphaNum 40) }}
{{- end }}
{{- $lines = append $lines (printf "bootstrap:admin:sha256:%s" ($bootstrap | sha256sum)) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "fastproof.labels" . | nindent 4 }}
type: Opaque
data:
  tokens: {{ printf "%s\n" (join "\n" $lines) | b64enc | quote }}
  {{- if $bootstrap }}
  bootstrap-token: {{ $bootstrap | b64enc | quote }}
  {{- end }}
---
{{- end }}
{{- if and .Values.oidc.issuer .Values.oidc.clientSecret.value (not .Values.oidc.clientSecret.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-oidc
  labels:
    {{- include "fastproof.labels" . | nindent 4 }}
type: Opaque
stringData:
  client-secret: {{ .Values.oidc.clientSecret.value | quote }}
---
{{- end }}
