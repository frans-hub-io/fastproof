database:
  existingSecret: fastproof-database

auth:
  adminTokens:
    existingSecret: fastproof-admin-tokens

server:
  logs:
    maxLineBytes: 131072
    maxLinesPerRequest: 10000
    maxRequestBytes: 16777216
    maxBytesPerLaunch: 1073741824

metrics:
  topBranches: 20

integrations:
  egressAllow:
    - hooks.example.com
    - "*.example.org:443"
    - smtp.example.com:465
    - 198.51.100.7
  secretsKey:
    existingSecret: fastproof-secrets-key
    key: keys
  smtp:
    url: smtps://smtp.example.com:465
    from: FastProof <fastproof@example.com>
    username: fastproof
    password:
      existingSecret: fastproof-smtp
  telegramApiUrl: https://telegram-proxy.example.com
  delivery:
    maxAttempts: 10
    backoffSeconds: 60

networkPolicy:
  enabled: true
  egress:
    database:
      to:
        - ipBlock:
            cidr: 198.51.100.10/32
    extraRules:
      - to:
          - ipBlock:
              cidr: 198.51.100.0/24
        ports:
          - port: 443
            protocol: TCP
          - port: 465
            protocol: TCP
