suite: streaming
templates:
  - templates/configmap.yaml
  - templates/deployment.yaml
  - templates/secrets.yaml
  - charts/kafka/templates/statefulset.yaml
  - charts/kafka/templates/serviceaccount.yaml
  - charts/kafka/templates/configmap.yaml
  - charts/kafka/templates/poddisruptionbudget.yaml
release:
  name: fp
  namespace: qa
values:
  - ../ci/minimal-fs-values.yaml
tests:
  - it: configures direct ingest and PostgreSQL search by default
    template: templates/configmap.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: data.FASTPROOF_INGEST_MODE
          value: direct
      - equal:
          path: data.FASTPROOF_SEARCH_BACKEND
          value: postgres
      - equal:
          path: data.FASTPROOF_SINKS
          value: ""
      - notExists:
          path: data.FASTPROOF_KAFKA_BROKERS

  - it: passes external Kafka with TLS and SCRAM through files
    template: templates/configmap.yaml
    documentIndex: 0
    set:
      ingest.mode: kafka
      kafka.external.brokers: [kafka-0.example.com:9093, kafka-1.example.com:9093]
      kafka.external.tls.enabled: true
      kafka.external.tls.ca.existingSecret: kafka-ca
      kafka.external.sasl.mechanism: scram-sha-256
      kafka.external.sasl.username: fastproof
      kafka.external.sasl.password.existingSecret: kafka-user
      kafka.topics.prefix: qa.
      kafka.topics.partitions: 24
    asserts:
      - equal:
          path: data.FASTPROOF_KAFKA_BROKERS
          value: kafka-0.example.com:9093,kafka-1.example.com:9093
      - equal:
          path: data.FASTPROOF_KAFKA_TLS
          value: "true"
      - equal:
          path: data.FASTPROOF_KAFKA_CA_FILE
          value: /etc/fastproof/ca/kafka.crt
      - equal:
          path: data.FASTPROOF_KAFKA_SASL_MECHANISM
          value: scram-sha-256
      - equal:
          path: data.FASTPROOF_KAFKA_PASSWORD_FILE
          value: /etc/fastproof/secrets/kafka-password
      - equal:
          path: data.FASTPROOF_KAFKA_TOPIC_PREFIX
          value: qa.
      - equal:
          path: data.FASTPROOF_KAFKA_PARTITIONS
          value: "24"
      - equal:
          path: data.FASTPROOF_KAFKA_CREATE_TOPICS
          value: "false"
      - equal:
          path: data.FASTPROOF_KAFKA_TRUSTED_PRODUCERS
          value: "false"
      - notExists:
          path: data.FASTPROOF_KAFKA_PASSWORD

  - it: mounts the external Kafka password and CA into the server
    template: templates/deployment.yaml
    documentIndex: 0
    set:
      ingest.mode: kafka
      kafka.external.brokers: [kafka-0.example.com:9093]
      kafka.external.tls.enabled: true
      kafka.external.tls.ca.existingConfigMap: corporate-ca
      kafka.external.sasl.mechanism: plain
      kafka.external.sasl.username: fastproof
      kafka.external.sasl.password.existingSecret: kafka-user
      kafka.external.sasl.password.key: secret
    asserts:
      - contains:
          path: spec.template.spec.volumes[1].projected.sources
          content:
            secret:
              name: kafka-user
              items:
                - key: secret
                  path: kafka-password
      - contains:
          path: spec.template.spec.volumes[2].projected.sources
          content:
            configMap:
              name: corporate-ca
              items:
                - key: ca.crt
                  path: kafka.crt

  - it: stores an inline external Kafka password in a Secret
    template: templates/secrets.yaml
    set:
      ingest.mode: kafka
      kafka.external.brokers: [kafka-0.example.com:9092]
      kafka.external.sasl.mechanism: plain
      kafka.external.sasl.username: fastproof
      kafka.external.sasl.password.value: s3cret
    documentSelector:
      path: metadata.name
      value: fp-fastproof-kafka
    asserts:
      - equal:
          path: stringData.password
          value: s3cret

  - it: points the server at the bundled broker with SASL PLAIN and creates topics
    template: templates/configmap.yaml
    documentIndex: 0
    set:
      ingest.mode: kafka
      kafka.enabled: true
    asserts:
      - equal:
          path: data.FASTPROOF_KAFKA_BROKERS
          value: fp-kafka:9092
      - equal:
          path: data.FASTPROOF_KAFKA_SASL_MECHANISM
          value: plain
      - equal:
          path: data.FASTPROOF_KAFKA_USERNAME
          value: fastproof
      - equal:
          path: data.FASTPROOF_KAFKA_CREATE_TOPICS
          value: "true"
      - equal:
          path: data.FASTPROOF_KAFKA_PARTITIONS
          value: "12"
      - equal:
          path: data.FASTPROOF_KAFKA_TLS
          value: "false"
      - notExists:
          path: data.FASTPROOF_KAFKA_CA_FILE

  - it: reads the client password from the Secret the kafka chart generates
    template: templates/deployment.yaml
    documentIndex: 0
    set:
      ingest.mode: kafka
      kafka.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.volumes[1].projected.sources
          content:
            secret:
              name: fp-kafka
              items:
                - key: client-password
                  path: kafka-password

  - it: reads the client password from an existing Secret
    template: templates/deployment.yaml
    documentIndex: 0
    set:
      ingest.mode: kafka
      kafka.enabled: true
      kafka.auth.existingSecret: kafka-sasl
    asserts:
      - contains:
          path: spec.template.spec.volumes[1].projected.sources
          content:
            secret:
              name: kafka-sasl
              items:
                - key: client-password
                  path: kafka-password

  - it: trusts the CA of the self-signed broker certificate
    template: templates/deployment.yaml
    documentIndex: 0
    set:
      ingest.mode: kafka
      kafka.enabled: true
      kafka.tls.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.volumes[2].projected.sources
          content:
            secret:
              name: fp-kafka-tls
              items:
                - key: ca.crt
                  path: kafka.crt

  - it: switches the client to TLS with the bundled broker
    template: templates/configmap.yaml
    documentIndex: 0
    set:
      ingest.mode: kafka
      kafka.enabled: true
      kafka.tls.enabled: true
      kafka.tls.source: cert-manager
      kafka.tls.certManager.issuerRef.name: internal-ca
    asserts:
      - equal:
          path: data.FASTPROOF_KAFKA_TLS
          value: "true"
      - equal:
          path: data.FASTPROOF_KAFKA_CA_FILE
          value: /etc/fastproof/ca/kafka.crt

  - it: trusts the CA of an existing broker certificate Secret
    template: templates/deployment.yaml
    documentIndex: 0
    set:
      ingest.mode: kafka
      kafka.enabled: true
      kafka.tls.enabled: true
      kafka.tls.source: existing-secret
      kafka.tls.existingSecret: kafka-broker-tls
      kafka.tls.caFilename: chain.pem
    asserts:
      - contains:
          path: spec.template.spec.volumes[2].projected.sources
          content:
            secret:
              name: kafka-broker-tls
              items:
                - key: chain.pem
                  path: kafka.crt

  - it: runs the bundled broker under its own ServiceAccount, non-root and read-only
    template: charts/kafka/templates/statefulset.yaml
    set:
      ingest.mode: kafka
      kafka.enabled: true
    asserts:
      - equal:
          path: metadata.name
          value: fp-kafka
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.template.spec.serviceAccountName
          value: fp-kafka
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.seccompProfile.type
          value: RuntimeDefault
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 1Gi
      - exists:
          path: spec.template.spec.containers[0].livenessProbe
      - exists:
          path: spec.template.spec.containers[0].readinessProbe
      - equal:
          path: spec.volumeClaimTemplates[0].spec.resources.requests.storage
          value: 10Gi
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: '^docker\.io/apache/kafka:4\.4\.0@sha256:[a-f0-9]{64}$'

  - it: creates the broker ServiceAccount without a token
    template: charts/kafka/templates/serviceaccount.yaml
    set:
      ingest.mode: kafka
      kafka.enabled: true
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: fp-kafka
      - equal:
          path: automountServiceAccountToken
          value: false

  - it: keeps topic creation with FastProof and authenticates the client listener
    template: charts/kafka/templates/configmap.yaml
    set:
      ingest.mode: kafka
      kafka.enabled: true
    asserts:
      - matchRegex:
          path: data["server.properties"]
          pattern: 'auto\.create\.topics\.enable=false'
      - matchRegex:
          path: data["server.properties"]
          pattern: 'listener\.security\.protocol\.map=CLIENT:SASL_PLAINTEXT,'
      - matchRegex:
          path: data["server.properties"]
          pattern: 'sasl\.enabled\.mechanisms=PLAIN'

  - it: adds no PodDisruptionBudget for a single broker
    template: charts/kafka/templates/poddisruptionbudget.yaml
    set:
      ingest.mode: kafka
      kafka.enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: adds a PodDisruptionBudget for three brokers
    template: charts/kafka/templates/poddisruptionbudget.yaml
    set:
      ingest.mode: kafka
      kafka.enabled: true
      kafka.replicaCount: 3
    asserts:
      - hasDocuments:
          count: 1
