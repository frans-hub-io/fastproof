publicUrl: https://fastproof.example.com

postgresql:
  enabled: true
  config:
    postgresql:
      max_connections: 80
      shared_buffers: 192MB
      effective_cache_size: 512MB
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

database:
  maxConnections: 12

garage:
  enabled: true
  persistence:
    dataSize: 10Gi

blob:
  backend: s3

auth:
  adminTokens:
    generate: true

server:
  ingestWorkers: 2

ingest:
  mode: kafka

search:
  backend: clickhouse

roles:
  split: true
  api:
    replicaCount: 1
    pdb:
      enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
        ephemeral-storage: 256Mi
      limits:
        cpu: "1"
        memory: 512Mi
        ephemeral-storage: 4Gi
  ingest:
    replicaCount: 1
    pdb:
      enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
        ephemeral-storage: 256Mi
      limits:
        cpu: "1"
        memory: 768Mi
        ephemeral-storage: 4Gi
  writer:
    replicaCount: 1
    pdb:
      enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 96Mi
        ephemeral-storage: 64Mi
      limits:
        cpu: 500m
        memory: 384Mi
        ephemeral-storage: 512Mi
  sink:
    replicaCount: 1
    pdb:
      enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 96Mi
        ephemeral-storage: 64Mi
      limits:
        cpu: 500m
        memory: 384Mi
        ephemeral-storage: 512Mi

kafka:
  topics:
    partitions: 6
  consumer:
    maxInflightBytes: 33554432
  enabled: true
  heapOpts: -Xms384m -Xmx384m
  kafkaConfig:
    logRetentionHours: 24
  persistence:
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 640Mi
    limits:
      cpu: "1"
      memory: 768Mi

sinks:
  clickhouse:
    enabled: true
    rawTtlDays: 14
    bundled:
      enabled: true
      persistence:
        size: 10Gi
      resources:
        requests:
          cpu: 200m
          memory: 1Gi
        limits:
          cpu: "2"
          memory: 2Gi

networkPolicy:
  enabled: true
