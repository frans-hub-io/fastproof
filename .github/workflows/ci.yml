name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_TOOLCHAIN: 1.99.1
  NODE_VERSION: 24.22.3
  DOTNET_SDK_VERSION: 10.0.403
  DOTNET_8_SDK_VERSION: 8.0.427
  PLATFORM_REPOSITORY: frans-hub-io/franshub-platform
  PLATFORM_REF: main
  GARAGE_IMAGE: docker.io/dxflrs/garage:v2.5.0@sha256:677e5b758e4425a325b811c425c026bf35a4bf42f7ddbaa773de3f4fd779a5a5
  HELM_VERSION: v3.22.1
  HELM_UNITTEST_VERSION: v1.2.1
  KUBECONFORM_VERSION: v0.8.0
  KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
  MKDOCS_MATERIAL_VERSION: 9.8.1
  SWAGGER_UI_VERSION: 5.34.1
  NO_MKDOCS_2_WARNING: "1"
  npm_config_fetch_retries: "5"
  npm_config_fetch_retry_mintimeout: "20000"
  npm_config_fetch_retry_maxtimeout: "120000"
  PIP_RETRIES: "10"

jobs:
  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: fastproof/ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: fastproof
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.PLATFORM_REPOSITORY }}
          ref: ${{ env.PLATFORM_REF }}
          ssh-key: ${{ secrets.PLATFORM_DEPLOY_KEY }}
          path: franshub-platform
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            fastproof/ui/package-lock.json
            franshub-platform/packages/ui-shell/package-lock.json
      - name: build ui-shell
        working-directory: franshub-platform/packages/ui-shell
        run: |
          npm ci
          npm run build
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: install playwright browsers
        run: npx playwright install --with-deps chromium
      - name: end-to-end tests with mocked API
        run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: playwright-report
          path: |
            fastproof/ui/playwright-report
            fastproof/ui/test-results
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ui-dist
          path: fastproof/ui/dist
          retention-days: 1

  e2e-real:
    name: e2e against the real server
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: ui
    services:
      postgres:
        image: docker.io/library/postgres:18.7-trixie
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      FASTPROOF_E2E_REAL: "1"
      FASTPROOF_E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      FASTPROOF_BIN: ${{ github.workspace }}/fastproof/target/debug/fastproof
    defaults:
      run:
        working-directory: fastproof
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: fastproof
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.PLATFORM_REPOSITORY }}
          ref: ${{ env.PLATFORM_REF }}
          ssh-key: ${{ secrets.PLATFORM_DEPLOY_KEY }}
          path: franshub-platform
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ui-dist
          path: fastproof/ui/dist
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: fastproof
          key: e2e-real
      - name: build the server with the UI
        run: cargo build -p fastproof-server --bin fastproof --locked
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            fastproof/ui/package-lock.json
            franshub-platform/packages/ui-shell/package-lock.json
      - name: build ui-shell
        working-directory: franshub-platform/packages/ui-shell
        run: |
          npm ci
          npm run build
      - name: install test dependencies
        working-directory: fastproof/ui
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: end-to-end tests against the server
        working-directory: fastproof/ui
        run: npm run e2e:real
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: playwright-real-report
          path: |
            fastproof/ui/playwright-report
            fastproof/ui/test-results
          retention-days: 7

  reporters:
    name: JavaScript and Python reporters against the real server
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: ui
    services:
      postgres:
        image: docker.io/library/postgres:18.7-trixie
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      FASTPROOF_TEST_SERVER_BIN: ${{ github.workspace }}/fastproof/target/debug/fastproof
      FASTPROOF_TEST_DATABASE_URL: postgres://postgres@localhost:5432/postgres
      FASTPROOF_TEST_CYPRESS: "1"
    defaults:
      run:
        working-directory: fastproof
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: fastproof
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.PLATFORM_REPOSITORY }}
          ref: ${{ env.PLATFORM_REF }}
          ssh-key: ${{ secrets.PLATFORM_DEPLOY_KEY }}
          path: franshub-platform
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ui-dist
          path: fastproof/ui/dist
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: fastproof
          key: e2e-real
      - name: build the server
        run: cargo build -p fastproof-server --bin fastproof --locked
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            fastproof/reporters/*/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            fastproof/reporters/pytest/pyproject.toml
            fastproof/reporters/allure-pytest/pyproject.toml
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('fastproof/reporters/cypress/package-lock.json') }}
      - name: Playwright reporter, build and unit tests
        working-directory: fastproof/reporters/playwright
        run: |
          npm ci
          npm run build
          npm run typecheck
          npm test
      - name: Vitest reporter, build and tests
        working-directory: fastproof/reporters/vitest
        run: |
          npm install --legacy-peer-deps
          npm run build
          npm run typecheck
          npm test
      - name: Jest reporter, build and tests
        working-directory: fastproof/reporters/jest
        run: |
          npm install --legacy-peer-deps
          npm run build
          npm run typecheck
          npm test
      - name: Cypress plugin, build and tests
        working-directory: fastproof/reporters/cypress
        run: |
          npm install --legacy-peer-deps
          npm run build
          npm run typecheck
          npm test
      - name: Allure JavaScript enhancer, build and tests
        working-directory: fastproof/reporters/allure-js
        run: |
          npm ci --legacy-peer-deps
          npm run build
          npm run typecheck
          npm test
      - name: pytest plugin unit tests
        working-directory: fastproof/reporters/pytest
        run: |
          bash "$GITHUB_WORKSPACE/fastproof/.github/scripts/retry.sh" pip install -e . pytest-rerunfailures pytest-xdist
          pytest
      - name: Allure pytest enhancer
        working-directory: fastproof/reporters/allure-pytest
        run: bash "$GITHUB_WORKSPACE/fastproof/.github/scripts/retry.sh" pip install -e . "allure-pytest==2.16.2"
      - name: install the browser for the Playwright integration tests
        working-directory: fastproof/reporters/playwright
        run: npx playwright install --with-deps chromium
      - name: ReportPortal agents for the compatibility tests
        run: |
          agents="$RUNNER_TEMP/rp-agents"
          mkdir -p "$agents"
          bash "$GITHUB_WORKSPACE/fastproof/.github/scripts/retry.sh" pip install --target "$agents/py" pytest==9.2.0 pytest-reportportal==5.6.13 pytest-rerunfailures==16.7 pytest-xdist==3.8.0
          npm install --prefix "$agents" @playwright/test@1.56.1 @reportportal/agent-js-playwright@5.5.0
          "$agents/node_modules/.bin/playwright" install --with-deps chromium
          echo "FASTPROOF_TEST_RP_AGENTS=$agents" >> "$GITHUB_ENV"
      - name: integration tests against the real server
        env:
          FASTPROOF_TEST_BROWSER: "1"
        run: python -m pytest -p no:fastproof reporters/integration -v
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: reporters-cypress-artifacts
          path: |
            fastproof/reporters/cypress/sample/cypress/screenshots
            fastproof/reporters/cypress/sample/cypress/videos
          retention-days: 7
          if-no-files-found: ignore

  reporters-jvm:
    name: JVM reporters (JDK ${{ matrix.java }}, JUnit ${{ matrix.junit }}) against the real server
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: ui
    strategy:
      fail-fast: false
      matrix:
        include:
          - java: "17"
            junit: 5.14.4
          - java: "25"
            junit: 6.1.0
          - java: "25"
            junit: 5.10.5
    services:
      postgres:
        image: docker.io/library/postgres:18.7-trixie
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      FASTPROOF_TEST_SERVER_BIN: ${{ github.workspace }}/fastproof/target/debug/fastproof
      FASTPROOF_TEST_DATABASE_URL: postgres://postgres@localhost:5432/postgres
      FASTPROOF_TEST_JUNIT_VERSION: ${{ matrix.junit }}
      MAVEN_VERSION: 3.9.16
      MAVEN_SHA512: 831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6
      MAVEN_ARGS: -Daether.connector.http.retryHandler.count=6 -Daether.connector.http.retryHandler.interval=10000
    defaults:
      run:
        working-directory: fastproof
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: fastproof
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.PLATFORM_REPOSITORY }}
          ref: ${{ env.PLATFORM_REF }}
          ssh-key: ${{ secrets.PLATFORM_DEPLOY_KEY }}
          path: franshub-platform
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ui-dist
          path: fastproof/ui/dist
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: fastproof
          key: reporters-jvm
      - name: build the server
        run: cargo build -p fastproof-server --bin fastproof --locked
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/fastproof-ci/maven
          key: maven-dist-${{ env.MAVEN_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.m2/repository
            !~/.m2/repository/io/franshub
          key: m2-${{ runner.os }}-junit-${{ matrix.junit }}-${{ hashFiles('fastproof/reporters/java/**/pom.xml') }}
          restore-keys: |
            m2-${{ runner.os }}-junit-${{ matrix.junit }}-
            m2-${{ runner.os }}-
      - name: install Maven
        run: |
          tarball="$HOME/.cache/fastproof-ci/maven/apache-maven-${MAVEN_VERSION}-bin.tar.gz"
          bash "$GITHUB_WORKSPACE/fastproof/.github/scripts/fetch.sh" sha512 "$MAVEN_SHA512" "$tarball" \
            "https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/${MAVEN_VERSION}/apache-maven-${MAVEN_VERSION}-bin.tar.gz" \
            "https://dlcdn.apache.org/maven/maven-3/${MAVEN_VERSION}/binaries/apache-maven-${MAVEN_VERSION}-bin.tar.gz" \
            "https://archive.apache.org/dist/maven/maven-3/${MAVEN_VERSION}/binaries/apache-maven-${MAVEN_VERSION}-bin.tar.gz"
          tar -xzf "$tarball" -C "$RUNNER_TEMP"
          echo "FASTPROOF_TEST_MVN=$RUNNER_TEMP/apache-maven-${MAVEN_VERSION}/bin/mvn" >> "$GITHUB_ENV"
      - name: JVM reporters, build and unit tests
        working-directory: fastproof/reporters/java
        run: '"$FASTPROOF_TEST_MVN" -B -ntp install'
      - name: install pytest
        run: bash "$GITHUB_WORKSPACE/fastproof/.github/scripts/retry.sh" pip install pytest==9.0.2
      - name: JVM integration tests against the real server
        run: python -m pytest -p no:fastproof reporters/integration/test_java.py -v

  reporters-dotnet:
    name: .NET reporters (NUnit, xUnit v3) against the real server
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: ui
    services:
      postgres:
        image: docker.io/library/postgres:18.7-trixie
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      FASTPROOF_TEST_SERVER_BIN: ${{ github.workspace }}/fastproof/target/debug/fastproof
      FASTPROOF_TEST_DATABASE_URL: postgres://postgres@localhost:5432/postgres
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    defaults:
      run:
        working-directory: fastproof
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: fastproof
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.PLATFORM_REPOSITORY }}
          ref: ${{ env.PLATFORM_REF }}
          ssh-key: ${{ secrets.PLATFORM_DEPLOY_KEY }}
          path: franshub-platform
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ui-dist
          path: fastproof/ui/dist
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: fastproof
          key: e2e-real
      - name: build the server
        run: cargo build -p fastproof-server --bin fastproof --locked
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: |
            ${{ env.DOTNET_8_SDK_VERSION }}
            ${{ env.DOTNET_SDK_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('fastproof/reporters/dotnet/**/*.csproj', 'fastproof/reporters/dotnet/**/*.props', 'fastproof/reporters/dotnet/global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - name: restore the packages
        working-directory: fastproof/reporters/dotnet
        run: |
          for p in src/FransHub.FastProof.Core src/FransHub.FastProof.NUnit src/FransHub.FastProof.Xunit \
            tests/FransHub.FastProof.Core.Tests samples/nunit samples/xunit; do
            bash "$GITHUB_WORKSPACE/fastproof/.github/scripts/retry.sh" dotnet restore "$p"
          done
      - name: build the packages
        working-directory: fastproof/reporters/dotnet
        run: |
          dotnet build src/FransHub.FastProof.Core -c Release --no-restore
          dotnet build src/FransHub.FastProof.NUnit -c Release --no-restore
          dotnet build src/FransHub.FastProof.Xunit -c Release --no-restore
      - name: core unit tests
        working-directory: fastproof/reporters/dotnet
        run: dotnet test tests/FransHub.FastProof.Core.Tests --no-restore
      - name: integration tests against the real server
        env:
          FASTPROOF_TEST_DOTNET: dotnet
        run: |
          bash "$GITHUB_WORKSPACE/fastproof/.github/scripts/retry.sh" pip install pytest==9.2.0
          python -m pytest -p no:fastproof reporters/integration/test_dotnet.py -v

  rust:
    name: rust (postgres ${{ matrix.postgres }}, valkey ${{ matrix.valkey }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: ui
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - postgres: 18.7-trixie
            valkey: 9.1.4-trixie
            lint: true
            experimental: false
          - postgres: 16.16-trixie
            valkey: 8.1.12-trixie
            lint: false
            experimental: false
          - postgres: 15.20-trixie
            valkey: 9.1.4-trixie
            lint: false
            experimental: false
          - postgres: 19.0-trixie
            valkey: 9.1.4-trixie
            lint: false
            experimental: true
    services:
      postgres:
        image: docker.io/library/postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      valkey:
        image: docker.io/valkey/valkey:${{ matrix.valkey }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      FASTPROOF_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      FASTPROOF_TEST_VALKEY_URL: redis://localhost:6379/0
      FASTPROOF_TEST_S3_ENDPOINT: http://localhost:3900
      FASTPROOF_TEST_S3_REGION: garage
      FASTPROOF_TEST_S3_BUCKET: fastproof-test
    defaults:
      run:
        working-directory: fastproof
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: fastproof
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.PLATFORM_REPOSITORY }}
          ref: ${{ env.PLATFORM_REF }}
          ssh-key: ${{ secrets.PLATFORM_DEPLOY_KEY }}
          path: franshub-platform
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ui-dist
          path: fastproof/ui/dist
      - name: start garage
        run: |
          access_key="GK$(openssl rand -hex 12)"
          secret_key="$(openssl rand -hex 32)"
          echo "::add-mask::${secret_key}"
          printf 'FASTPROOF_TEST_S3_ACCESS_KEY=%s\nFASTPROOF_TEST_S3_SECRET_KEY=%s\n' "$access_key" "$secret_key" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/garage"
          cat > "$RUNNER_TEMP/garage/garage.toml" <<'EOF'
          metadata_dir = "/var/lib/garage/meta"
          data_dir = "/var/lib/garage/data"
          db_engine = "sqlite"
          replication_factor = 1
          rpc_bind_addr = "0.0.0.0:3901"
          rpc_public_addr = "127.0.0.1:3901"

          [s3_api]
          s3_region = "garage"
          api_bind_addr = "0.0.0.0:3900"

          [admin]
          api_bind_addr = "0.0.0.0:3903"
          EOF
          docker run -d --name garage \
            -p 3900:3900 -p 3903:3903 \
            --tmpfs /var/lib/garage:rw,mode=1777 \
            -v "$RUNNER_TEMP/garage/garage.toml:/etc/garage.toml:ro" \
            -e GARAGE_RPC_SECRET="$(openssl rand -hex 32)" \
            -e GARAGE_DEFAULT_ACCESS_KEY="$access_key" \
            -e GARAGE_DEFAULT_SECRET_KEY="$secret_key" \
            -e GARAGE_DEFAULT_BUCKET="$FASTPROOF_TEST_S3_BUCKET" \
            "$GARAGE_IMAGE" /garage server --single-node --default-bucket
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:3903/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs garage
          exit 1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: fastproof
          key: pg-${{ matrix.postgres }}
      - if: matrix.lint
        run: cargo fmt --all -- --check
      - if: matrix.lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked --no-fail-fast
      - if: failure()
        run: docker logs garage

  helm:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: deploy/helm/fastproof
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310
        with:
          version: ${{ env.HELM_VERSION }}
      - name: fetch chart dependencies
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/retry.sh" helm repo add cnpg https://cloudnative-pg.github.io/charts
          bash "$GITHUB_WORKSPACE/.github/scripts/retry.sh" helm repo add valkey https://valkey.io/valkey-helm/
          bash "$GITHUB_WORKSPACE/.github/scripts/retry.sh" helm repo add opensearch https://opensearch-project.github.io/helm-charts
          bash "$GITHUB_WORKSPACE/.github/scripts/retry.sh" helm dependency build .
      - name: lint
        run: |
          for f in ci/*.yaml; do
            echo "::group::helm lint $f"
            helm lint --strict . -f "$f"
            echo "::endgroup::"
          done
      - name: unit tests
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest.git --version "$HELM_UNITTEST_VERSION"
          helm unittest .
      - name: install kubeconform
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/fetch.sh" sha256 "$KUBECONFORM_SHA256" "$RUNNER_TEMP/kubeconform.tar.gz" \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar -xzf "$RUNNER_TEMP/kubeconform.tar.gz" -C "$RUNNER_TEMP" kubeconform
      - name: render and validate
        run: |
          mkdir -p "$RUNNER_TEMP/render"
          for f in ci/*.yaml; do
            out="$RUNNER_TEMP/render/$(basename "$f")"
            helm template fastproof . --namespace qa -f "$f" \
              --api-versions postgresql.cnpg.io/v1 \
              --api-versions monitoring.coreos.com/v1 \
              --api-versions gateway.networking.k8s.io/v1 > "$out"
            for k in 1.30.0 1.36.0; do
              echo "::group::kubeconform $f kubernetes $k"
              "$RUNNER_TEMP/kubeconform" -strict -summary -kubernetes-version "$k" \
                -schema-location default \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
                "$out"
              echo "::endgroup::"
            done
          done

  image:
    name: release build of the image
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      VERSION: 0.0.0-ci.${{ github.run_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: fastproof
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.PLATFORM_REPOSITORY }}
          ref: ${{ env.PLATFORM_REF }}
          ssh-key: ${{ secrets.PLATFORM_DEPLOY_KEY }}
          path: franshub-platform
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: build the image for linux/amd64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: fastproof/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: fastproof:ci
          build-args: |
            VERSION=${{ env.VERSION }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=ci-image
          cache-to: type=gha,scope=ci-image,mode=max
      - name: check the version and the build paths of the binary
        run: |
          id="$(docker create fastproof:ci)"
          docker cp "$id:/usr/local/bin/fastproof" "$RUNNER_TEMP/fastproof"
          docker rm "$id"
          test "$(docker run --rm fastproof:ci version)" = "fastproof $VERSION"
          bash fastproof/.github/scripts/check-binary.sh "$RUNNER_TEMP/fastproof" "$VERSION" \
            "$GITHUB_WORKSPACE" /src/fastproof /src/franshub-platform /usr/local/cargo /usr/local/rustup /root/

  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: bash "$GITHUB_WORKSPACE/.github/scripts/retry.sh" pip install "mkdocs-material==${MKDOCS_MATERIAL_VERSION}"
      - run: docs/prepare.sh
      - run: mkdocs build --strict
