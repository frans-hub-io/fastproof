[workspace]
resolver = "2"
members = ["crates/fastproof-model", "crates/fastproof-ingest"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/frans-hub-io/fastproof"

[workspace.dependencies]
fastproof-model = { path = "crates/fastproof-model" }
ammonia = "4.2.5"
flate2 = "1.1.11"
md-5 = "0.11.0"
quick-xml = "0.42.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tar = { version = "0.4.46", default-features = false }
tempfile = "3.27.0"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["parsing", "formatting", "macros"] }
unicode-normalization = "0.1.26"
utoipa = "6.0.0"
zip = { version = "=9.4.2", default-features = false, features = ["deflate-flate2"] }
