name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: docker.io/franshub/fastproof
  PLATFORM_REPOSITORY: frans-hub-io/franshub-platform
  PLATFORM_REF: main

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment:
      name: release
      url: https://hub.docker.com/r/franshub/fastproof
    steps:
      - name: check the tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::tag $TAG is not v<semver>"
            exit 1
          fi
          case "$version" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          printf 'version=%s\nprerelease=%s\n' "$version" "$prerelease" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: fastproof
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.PLATFORM_REPOSITORY }}
          ref: ${{ env.PLATFORM_REF }}
          ssh-key: ${{ secrets.PLATFORM_DEPLOY_KEY }}
          path: franshub-platform
          persist-credentials: false
      - name: record the platform revision
        id: platform
        run: printf 'revision=%s\n' "$(git -C franshub-platform rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ steps.version.outputs.prerelease == 'false' }}
          labels: |
            org.opencontainers.image.title=FastProof
            org.opencontainers.image.vendor=FransHub
            org.opencontainers.image.licenses=Apache-2.0
            io.franshub.platform.revision=${{ steps.platform.outputs.revision }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: fastproof/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=release
          cache-to: type=gha,scope=release,mode=max
