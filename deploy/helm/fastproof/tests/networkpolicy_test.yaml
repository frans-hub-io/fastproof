suite: network policies
templates:
  - templates/networkpolicy.yaml
release:
  name: fp
  namespace: qa
values:
  - ../ci/cloudpirates-garage-values.yaml
tests:
  - it: lets only the monitoring namespace reach the ops port
    documentIndex: 0
    asserts:
      - contains:
          path: spec.ingress
          content:
            ports:
              - port: ops
                protocol: TCP
            from:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: monitoring
                podSelector: {}
      - contains:
          path: spec.policyTypes
          content: Egress

  - it: never selects CloudNativePG pods in the storage policy
    documentIndex: 1
    asserts:
      - contains:
          path: spec.podSelector.matchExpressions
          content:
            key: cnpg.io/cluster
            operator: DoesNotExist
      - equal:
          path: spec.podSelector.matchExpressions[0].values
          value:
            - postgresql

  - it: allows egress to the CloudNativePG cluster by its own label
    capabilities:
      apiVersions:
        - postgresql.cnpg.io/v1
    values:
      - ../ci/cnpg-external-s3-values.yaml
    set:
      postgresql.enabled: false
      garage.enabled: false
    asserts:
      - hasDocuments:
          count: 1
      - contains:
          path: spec.egress
          content:
            to:
              - podSelector:
                  matchLabels:
                    cnpg.io/cluster: fp-cnpg
            ports:
              - port: 5432
                protocol: TCP
      - contains:
          path: spec.egress
          content:
            to:
              - ipBlock:
                  cidr: 198.51.100.0/24
            ports:
              - port: 443
                protocol: TCP

  - it: lets the server reach the bundled Kafka and ClickHouse and nothing else reach them
    values:
      - ../ci/bigdata-values.yaml
    asserts:
      - contains:
          path: spec.egress
          content:
            to:
              - podSelector:
                  matchLabels:
                    app.kubernetes.io/name: kafka
                    app.kubernetes.io/instance: fp
            ports:
              - port: 9092
                protocol: TCP
        documentIndex: 0
      - contains:
          path: spec.egress
          content:
            to:
              - podSelector:
                  matchLabels:
                    app.kubernetes.io/name: clickhouse
                    app.kubernetes.io/instance: fp
            ports:
              - port: 8123
                protocol: TCP
        documentIndex: 0
      - equal:
          path: metadata.name
          value: fp-fastproof-kafka
        documentIndex: 2
      - equal:
          path: spec.ingress[0].ports[0].port
          value: 9092
        documentIndex: 2
      - equal:
          path: metadata.name
          value: fp-fastproof-clickhouse
        documentIndex: 3
      - lengthEqual:
          path: spec.ingress
          count: 1
        documentIndex: 3
