{{- $fullname := include "fastproof.fullname" . -}}
{{- $split := .Values.roles.split -}}
{{- $docs := list -}}
{{- range $w := include "fastproof.workloads" . | fromJsonArray }}
{{- $many := or $w.autoscaling.enabled (gt (int $w.replicaCount) 1) }}
{{- if and $w.pdb.enabled $many }}
{{- $docs = append $docs (dict "kind" "pdb" "w" $w) }}
{{- end }}
{{- if $w.autoscaling.enabled }}
{{- $docs = append $docs (dict "kind" "hpa" "w" $w) }}
{{- end }}
{{- end }}
{{- range $i, $d := $docs }}
{{- $w := $d.w }}
{{- if $i }}
---
{{- end }}
{{- if eq $d.kind "pdb" }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $w.name }}
  labels:
    {{- include "fastproof.labels" $ | nindent 4 }}
spec:
  maxUnavailable: {{ $w.pdb.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "fastproof.workloadSelector" (dict "root" $ "role" $w.role) | nindent 6 }}
{{- else }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $w.name }}
  labels:
    {{- include "fastproof.labels" $ | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $w.name }}
  minReplicas: {{ $w.autoscaling.minReplicas }}
  maxReplicas: {{ $w.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $w.autoscaling.targetCPUUtilizationPercentage }}
    {{- if $w.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ $w.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
{{- end }}
{{- end }}
{{- if .Values.metrics.serviceMonitor.enabled }}
{{- if $docs }}
---
{{- end }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "fastproof.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "fastproof.selector" . | nindent 6 }}
      {{- if $split }}
      fastproof.franshub.io/service: ops
      {{- end }}
  endpoints:
    - port: ops
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.metrics.serviceMonitor.scrapeTimeout }}
{{- end }}
