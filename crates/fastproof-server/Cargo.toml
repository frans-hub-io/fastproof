[package]
name = "fastproof-server"
description = "FastProof: self-hosted test reporting server and CLI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[lib]
name = "fastproof_server"
path = "src/lib.rs"

[[bin]]
name = "fastproof"
path = "src/main.rs"

