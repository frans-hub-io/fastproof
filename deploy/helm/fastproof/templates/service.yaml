apiVersion: v1
kind: Service
metadata:
  name: {{ include "fastproof.fullname" . }}
  labels:
    {{- include "fastproof.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
    {{- with .Values.service.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "fastproof.workloadSelector" (dict "root" . "role" (ternary "api" "" .Values.roles.split)) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      {{- if .Values.tls.existingSecret }}
      appProtocol: https
      {{- end }}
    - name: ops
      port: {{ .Values.service.opsPort }}
      targetPort: ops
      protocol: TCP
{{- if .Values.roles.split }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fastproof.fullname" . }}-ops
  labels:
    {{- include "fastproof.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
    fastproof.franshub.io/service: ops
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    {{- include "fastproof.selector" . | nindent 4 }}
  ports:
    - name: ops
      port: {{ .Values.service.opsPort }}
      targetPort: ops
      protocol: TCP
{{- end }}
