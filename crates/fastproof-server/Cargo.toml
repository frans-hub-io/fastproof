fastproof-blob.workspace = true
fastproof-ingest.workspace = true
fastproof-model = { workspace = true, features = ["openapi"] }
fastproof-store.workspace = true
fastproof-stream.workspace = true
fastproof-tm-import.workspace = true
fastproof-media.workspace = true
fastproof-rp.workspace = true
fastproof-analysis.workspace = true
flate2.workspace = true
franshub-access.workspace = true
franshub-auth.workspace = true
franshub-http.workspace = true
franshub-observe.workspace = true
franshub-oidc.workspace = true
franshub-store-pg.workspace = true
futures.workspace = true
hex.workspace = true
lettre.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
