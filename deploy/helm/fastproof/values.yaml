image:
  repository: docker.io/franshub/fastproof
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

replicaCount: 1

publicUrl: ""

server:
  logFormat: json
  logFilter: info
  ui: true
  maxUploadBytes: 1073741824
  mediaUrlTtlSeconds: 300
  mediaMaxStreams: 256
  mediaStreamTimeoutSeconds: 60
  mediaKeyReloadSeconds: 30
  blobBackendMigrated: false
  mediaUrlKey:
    existingSecret: ""
    key: media-url-key
  ingestWorkers: 2
  retainUploads: false
  outboxRetentionDays: 7
  logs:
    maxLineBytes: 65536
    maxLinesPerRequest: 5000
    maxRequestBytes: 8388608
    maxBytesPerLaunch: 268435456
  guards:
    sseMaxPerCaller: 16
    sseRecheckSeconds: 300
    heavyQueriesPerCaller: 4
    maxConcurrentSpools: 32
    bodyIdleTimeoutSeconds: 60
  extraEnv: []
  extraEnvFrom: []

ingest:
  mode: direct

search:
  backend: postgres

roles:
  split: false
  api:
    replicaCount: 2
    extraRoles:
      - scheduler
    resources: {}
    startupProbe: {}
    readinessProbe: {}
    livenessProbe: {}
    autoscaling:
      enabled: false
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
      targetMemoryUtilizationPercentage: 0
    pdb:
      enabled: true
      maxUnavailable: 1
    podAnnotations: {}
    podLabels: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
    topologySpreadConstraints: []
  ingest:
    replicaCount: 1
    extraRoles: []
    resources: {}
    startupProbe: {}
    readinessProbe: {}
    livenessProbe: {}
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 4
      targetCPUUtilizationPercentage: 70
      targetMemoryUtilizationPercentage: 0
    pdb:
      enabled: true
      maxUnavailable: 1
    podAnnotations: {}
    podLabels: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
    topologySpreadConstraints: []
  writer:
    replicaCount: 1
    extraRoles: []
    resources:
      requests:
        cpu: 100m
        memory: 192Mi
        ephemeral-storage: 64Mi
      limits:
        cpu: "1"
        memory: 512Mi
        ephemeral-storage: 1Gi
    startupProbe: {}
    readinessProbe: {}
    livenessProbe: {}
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 4
      targetCPUUtilizationPercentage: 70
      targetMemoryUtilizationPercentage: 0
    pdb:
      enabled: true
      maxUnavailable: 1
    podAnnotations: {}
    podLabels: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
    topologySpreadConstraints: []
  sink:
    replicaCount: 1
    extraRoles: []
    resources:
      requests:
        cpu: 50m
        memory: 192Mi
        ephemeral-storage: 64Mi
      limits:
        cpu: "1"
        memory: 512Mi
        ephemeral-storage: 1Gi
    startupProbe: {}
    readinessProbe: {}
    livenessProbe: {}
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 70
      targetMemoryUtilizationPercentage: 0
    pdb:
      enabled: true
      maxUnavailable: 1
    podAnnotations: {}
    podLabels: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
    topologySpreadConstraints: []

database:
  existingSecret: ""
  secretKey: database-url
  url: ""
  maxConnections: 20
  sizingCheck: true
  statementTimeoutSeconds: 120
  ingestReserve: 0
  connectTimeoutSeconds: 300
  sslMode: ""
  ca:
    existingSecret: ""
    existingConfigMap: ""
    key: ca.crt

migrations:
  mode: job
  job:
    backoffLimit: 3
    activeDeadlineSeconds: 900
    podAnnotations: {}
    podLabels: {}
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi

blob:
  backend: ""
  fs:
    persistence:
      enabled: true
      existingClaim: ""
      storageClass: ""
      accessModes:
        - ReadWriteOnce
      size: 20Gi
      annotations: {}
  s3:
    endpoint: ""
    region: us-east-1
    bucket: ""
    pathStyle: true
    credentials:
      existingSecret: ""
      accessKeyKey: access-key
      secretKeyKey: secret-key
      accessKey: ""
      secretKey: ""
    ca:
      existingSecret: ""
      existingConfigMap: ""
      key: ca.crt
  directUploads:
    enabled: auto
    publicEndpoint: ""
    allowHttp: false
    urlTtlSeconds: 900
    maxBytes: 1073741824

spool:
  sizeLimit: 4Gi
  medium: ""

auth:
  adminTokens:
    existingSecret: ""
    key: tokens
    tokens: []
    generate: false
  access:
    existingConfigMap: ""
    key: access.yaml
    roles: []
    bindings: []

oidc:
  issuer: ""
  clientId: ""
  clientSecret:
    existingSecret: ""
    key: client-secret
    value: ""
  redirectUrl: ""
  scopes: []
  usernameClaim: ""
  groupsClaim: ""
  allowedAlgs: []
  apiAudience: ""
  allowedHosts: []
  sessionTtl: ""
  sessionIdle: ""
  cookieName: ""
  postLogoutRedirect: ""
  insecureCookie: false
  ca:
    existingSecret: ""
    existingConfigMap: ""
    key: ca.crt

tls:
  existingSecret: ""
  clientCa:
    existingSecret: ""
    existingConfigMap: ""
    key: ca.crt

externalValkey:
  existingSecret: ""
  key: url

integrations:
  egressAllow: []
  secretsKey:
    existingSecret: ""
    key: secrets-key
    value: ""
  smtp:
    url: ""
    from: ""
    username: ""
    password:
      existingSecret: ""
      key: password
      value: ""
  telegramApiUrl: ""
  delivery:
    maxAttempts: 6
    backoffSeconds: 30

otel:
  endpoint: ""
  protocol: ""
  serviceName: fastproof
  resourceAttributes: ""

service:
  type: ClusterIP
  port: 8080
  opsPort: 9090
  annotations: {}
  labels: {}

httpRoute:
  enabled: false
  annotations: {}
  parentRefs: []
  hostnames: []
  timeouts: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

metrics:
  topBranches: 10
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}

networkPolicy:
  enabled: false
  ingress:
    from: []
    metrics:
      namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
      podSelector: {}
  egress:
    enabled: true
    dns:
      namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    database:
      to: []
      ports:
        - 5432
    s3:
      to: []
      ports:
        - 443
    oidc:
      to: []
      ports:
        - 443
    valkey:
      to: []
      ports:
        - 6379
    otlp:
      to: []
      ports:
        - 4317
        - 4318
    kafka:
      to: []
      ports:
        - 9092
    clickhouse:
      to: []
      ports:
        - 8443
    opensearch:
      to: []
      ports:
        - 9200
    extraRules: []
  storage: true
  garagePorts:
    - 3900

pdb:
  enabled: true
  maxUnavailable: 1

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 0

startupProbe:
  periodSeconds: 2
  timeoutSeconds: 2
  failureThreshold: 60
readinessProbe:
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3
livenessProbe:
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 6

resources:
  requests:
    cpu: 100m
    memory: 128Mi
    ephemeral-storage: 256Mi
  limits:
    cpu: "2"
    memory: 1Gi
    ephemeral-storage: 6Gi

terminationGracePeriodSeconds: 60

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}
priorityClassName: ""
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
extraVolumes: []
extraVolumeMounts: []

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

postgresql:
  enabled: false
  image:
    registry: docker.io
    repository: postgres
    tag: "18.7-trixie@sha256:eb63372c1e05c755f55fa30cbd07aecc443676fc6c0fa90b9002d01537841e1a"
    imagePullPolicy: IfNotPresent
  customUser:
    name: fastproof
    database: fastproof
    existingSecret: "{{ .Release.Name }}-fastproof-db"
  persistence:
    size: 10Gi
    storageClass: ""
  serviceAccount:
    create: true
    automountServiceAccountToken: false
  podSecurityContext:
    fsGroup: 999
    seccompProfile:
      type: RuntimeDefault
  config:
    postgresql:
      max_connections: 120
      shared_buffers: 256MB
      effective_cache_size: 768MB
      work_mem: 4MB
      maintenance_work_mem: 64MB
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1536Mi

cnpg:
  enabled: false
  type: postgresql
  mode: standalone
  version:
    postgresql: "18"
  cluster:
    instances: 3
    imageName: ghcr.io/cloudnative-pg/postgresql:18.7-standard-trixie
    storage:
      size: 10Gi
      storageClass: ""
    enableSuperuserAccess: false
    postgresql:
      parameters:
        max_connections: "200"
    initdb:
      database: fastproof
      owner: fastproof
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
  backups:
    enabled: false

valkey:
  enabled: false
  image:
    registry: docker.io
    repository: valkey/valkey
    tag: "9.1.4-trixie"
  auth:
    enabled: true
    usersExistingSecret: "{{ .Release.Name }}-fastproof-valkey"
    aclUsers:
      default:
        permissions: "~* &* +@all"
        passwordKey: password
  valkeyConfig: |
    maxmemory 128mb
    maxmemory-policy allkeys-lru
    save ""
    appendonly no
  readinessProbe:
    enabled: true
  dataStorage:
    enabled: false
  initResources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 64Mi
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

garage:
  enabled: true
  image:
    repository: docker.io/dxflrs/garage
    tag: v2.5.0
    digest: sha256:677e5b758e4425a325b811c425c026bf35a4bf42f7ddbaa773de3f4fd779a5a5
    pullPolicy: IfNotPresent
  bucket: fastproof
  region: garage
  dbEngine: sqlite
  credentials:
    existingSecret: ""
    accessKeyKey: access-key
    secretKeyKey: secret-key
    rpcSecretKey: rpc-secret
  persistence:
    enabled: true
    storageClass: ""
    metaSize: 1Gi
    dataSize: 20Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  nodeSelector: {}
  tolerations: []
  affinity: {}

kafka:
  enabled: false
  topics:
    prefix: fastproof.
    create: false
    partitions: 12
    replication: -1
  trustedProducers: false
  clientId: fastproof
  maxRecordBytes: 900000
  signatureMaxAgeHours: 168
  connectTimeoutSeconds: 300
  consumer:
    fetchMaxBytes: 1048576
    maxInflightBytes: 67108864
    batchMaxRecords: 1000
    batchMaxBytes: 1048576
  external:
    brokers: []
    tls:
      enabled: false
      ca:
        existingSecret: ""
        existingConfigMap: ""
        key: ca.crt
    sasl:
      mechanism: ""
      username: ""
      password:
        existingSecret: ""
        key: password
        value: ""
  replicaCount: 1
  image:
    imagePullPolicy: IfNotPresent
  serviceAccount:
    create: true
    automountServiceAccountToken: false
  auth:
    client:
      enabled: true
    interBroker:
      enabled: true
    controller:
      enabled: true
    clientUser: fastproof
    existingSecret: ""
  tls:
    enabled: false
    source: self-signed
  kafkaConfig:
    autoCreateTopicsEnable: false
    logRetentionHours: 72
  heapOpts: -Xmx512m -Xms512m
  persistence:
    enabled: true
    size: 10Gi
    mountPath: /var/lib/kafka/data
    dataDir: /var/lib/kafka/data/kraft
  extraVolumes:
    - name: tmp
      emptyDir:
        sizeLimit: 128Mi
  extraVolumeMounts:
    - name: tmp
      mountPath: /tmp
  resources:
    requests:
      cpu: 100m
      memory: 768Mi
    limits:
      cpu: "1"
      memory: 1Gi

sinks:
  batchSize: 2000
  flushIntervalMs: 1000
  clickhouse:
    enabled: false
    database: fastproof
    rawTtlDays: 90
    external:
      url: ""
      user: ""
      password:
        existingSecret: ""
        key: password
        value: ""
      ca:
        existingSecret: ""
        existingConfigMap: ""
        key: ca.crt
    bundled:
      enabled: false
      image:
        repository: docker.io/clickhouse/clickhouse-server
        tag: 26.8.36.3-distroless
        digest: sha256:d149c739994af7d3687b05ce3111b6a748e0f17702c80b52a93c0161a439a091
        pullPolicy: IfNotPresent
      user: fastproof
      extraGrants:
        - GRANT SELECT ON system.parts
      credentials:
        existingSecret: ""
        key: password
      tls:
        existingSecret: ""
      server:
        max_server_memory_usage_to_ram_ratio: "0.75"
        cache_size_to_ram_max_ratio: "0.2"
        mark_cache_size: "268435456"
        uncompressed_cache_size: "0"
        index_mark_cache_size: "67108864"
        index_uncompressed_cache_size: "0"
        primary_index_cache_size: "67108864"
        text_index_tokens_cache_size: "33554432"
        text_index_header_cache_size: "33554432"
        text_index_postings_cache_size: "33554432"
        page_cache_max_size: "0"
        query_condition_cache_size: "33554432"
        background_pool_size: "4"
        background_schedule_pool_size: "32"
        max_concurrent_queries: "50"
        merges_mutations_memory_usage_to_ram_ratio: "0.3"
      mergeTree:
        number_of_free_entries_in_pool_to_execute_mutation: "2"
        number_of_free_entries_in_pool_to_lower_max_size_of_merge: "2"
        number_of_free_entries_in_pool_to_execute_optimize_entire_partition: "2"
      profile:
        max_memory_usage: "1073741824"
        max_threads: "2"
        max_insert_threads: "1"
      queryLogTtlDays: 3
      persistence:
        enabled: true
        storageClass: ""
        size: 20Gi
      resources:
        requests:
          cpu: 250m
          memory: 1Gi
        limits:
          cpu: "2"
          memory: 2Gi
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      nodeSelector: {}
      tolerations: []
      affinity: {}
  opensearch:
    enabled: false
    indexPrefix: fastproof-
    rawTtlDays: 90
    replicas: 1
    external:
      url: ""
      user: ""
      password:
        existingSecret: ""
        key: password
        value: ""
      ca:
        existingSecret: ""
        existingConfigMap: ""
        key: ca.crt
    bundled:
      user: fastproof
      credentialsSecret: fastproof-opensearch-credentials
      tlsSecret: fastproof-opensearch-tls
      generateTls: true

opensearch:
  enabled: false
  clusterName: fastproof-opensearch
  nodeGroup: node
  masterService: fastproof-opensearch-node
  singleNode: true
  replicas: 1
  majorVersion: "3"
  image:
    repository: docker.io/opensearchproject/opensearch
    tag: "3.9.0@sha256:3bf4fe26aeb9f7b03c0ebcb1302bb24e855ee6b89fd926d26a71a83ef6f7e076"
    pullPolicy: IfNotPresent
  opensearchJavaOpts: -Xms768m -Xmx768m
  resources:
    requests:
      cpu: 250m
      memory: 1536Mi
    limits:
      cpu: "2"
      memory: 1536Mi
  initResources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
  persistence:
    enabled: true
    enableInitChown: false
    size: 10Gi
  sysctlInit:
    enabled: false
  rbac:
    create: true
    automountServiceAccountToken: false
  enableServiceLinks: false
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  livenessProbe:
    tcpSocket:
      port: 9200
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 10
  extraEnvs:
    - name: DISABLE_INSTALL_DEMO_CONFIG
      value: "true"
  secretMounts:
    - name: fastproof-tls
      secretName: fastproof-opensearch-tls
      path: /usr/share/opensearch/config/certs
  securityConfig:
    enabled: true
    config:
      securityConfigSecret: fastproof-opensearch-security
  config:
    opensearch.yml: |
      cluster.name: fastproof-opensearch
      network.host: 0.0.0.0
      node.store.allow_mmap: false
      plugins.security.ssl.transport.pemcert_filepath: certs/tls.crt
      plugins.security.ssl.transport.pemkey_filepath: certs/tls.key
      plugins.security.ssl.transport.pemtrustedcas_filepath: certs/ca.crt
      plugins.security.ssl.transport.enforce_hostname_verification: false
      plugins.security.ssl.http.enabled: true
      plugins.security.ssl.http.pemcert_filepath: certs/tls.crt
      plugins.security.ssl.http.pemkey_filepath: certs/tls.key
      plugins.security.ssl.http.pemtrustedcas_filepath: certs/ca.crt
      plugins.security.allow_default_init_securityindex: true
      plugins.security.authcz.admin_dn:
        - CN=fastproof-opensearch-admin
      plugins.security.nodes_dn:
        - CN=fastproof-opensearch-node
      plugins.security.restapi.roles_enabled:
        - all_access
      plugins.security.system_indices.enabled: true
