{{- $fullname := include "fastproof.fullname" . -}}
{{- $np := .Values.networkPolicy -}}
{{- $bundled := list -}}
{{- if .Values.postgresql.enabled }}{{ $bundled = append $bundled "postgresql" }}{{ end -}}
{{- if .Values.valkey.enabled }}{{ $bundled = append $bundled "valkey" }}{{ end -}}
{{- if .Values.garage.enabled }}{{ $bundled = append $bundled "garage" }}{{ end -}}
{{- $kafkaBundled := and (include "fastproof.kafkaMode" .) .Values.kafka.enabled -}}
{{- $chBundled := and .Values.sinks.clickhouse.enabled .Values.sinks.clickhouse.bundled.enabled -}}
{{- $chPort := ternary 8443 8123 (not (empty .Values.sinks.clickhouse.bundled.tls.existingSecret)) -}}
{{- $osBundled := and .Values.sinks.opensearch.enabled .Values.opensearch.enabled -}}
{{- $streaming := list -}}
{{- if $kafkaBundled }}{{ $streaming = append $streaming (dict "name" (default "kafka" .Values.kafka.nameOverride) "port" (include "fastproof.kafkaClientPort" . | int) "self" true) }}{{ end -}}
{{- if $chBundled }}{{ $streaming = append $streaming (dict "name" "clickhouse" "port" $chPort "self" false) }}{{ end -}}
{{- if $osBundled }}{{ $streaming = append $streaming (dict "name" "opensearch" "port" 9200 "self" true) }}{{ end -}}
{{- if $np.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "fastproof.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "fastproof.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: ["server", "migrate"]
  policyTypes:
    - Ingress
    {{- if $np.egress.enabled }}
    - Egress
    {{- end }}
  ingress:
    - ports:
        - port: http
          protocol: TCP
      {{- with $np.ingress.from }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    - ports:
        - port: ops
          protocol: TCP
      from:
        - namespaceSelector:
            {{- toYaml $np.ingress.metrics.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml $np.ingress.metrics.podSelector | nindent 12 }}
  {{- if $np.egress.enabled }}
  egress:
    - to:
        - namespaceSelector:
            {{- toYaml $np.egress.dns.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml $np.egress.dns.podSelector | nindent 12 }}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- if .Values.postgresql.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
              app.kubernetes.io/instance: {{ .Release.Name }}
            matchExpressions:
              - key: cnpg.io/cluster
                operator: DoesNotExist
      ports:
        - port: 5432
          protocol: TCP
    {{- end }}
    {{- if .Values.cnpg.enabled }}
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: {{ include "fastproof.dependencyFullname" (dict "root" . "name" "cnpg") }}
      ports:
        - port: 5432
          protocol: TCP
    {{- end }}
    {{- if .Values.valkey.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: valkey
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - port: 6379
          protocol: TCP
    {{- end }}
    {{- if .Values.garage.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: garage
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - port: 3900
          protocol: TCP
    {{- end }}
    {{- range $streaming }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .name }}
              app.kubernetes.io/instance: {{ $.Release.Name }}
      ports:
        - port: {{ .port }}
          protocol: TCP
    {{- end }}
    {{- $external := list -}}
    {{- if not (include "fastproof.bundledDatabase" .) }}{{ $external = append $external $np.egress.database }}{{ end -}}
    {{- if and (eq .Values.blob.backend "s3") (not .Values.garage.enabled) }}{{ $external = append $external $np.egress.s3 }}{{ end -}}
    {{- if .Values.oidc.issuer }}{{ $external = append $external $np.egress.oidc }}{{ end -}}
    {{- if .Values.externalValkey.existingSecret }}{{ $external = append $external $np.egress.valkey }}{{ end -}}
    {{- if .Values.otel.endpoint }}{{ $external = append $external $np.egress.otlp }}{{ end -}}
    {{- if and (include "fastproof.kafkaMode" .) (not .Values.kafka.enabled) }}{{ $external = append $external $np.egress.kafka }}{{ end -}}
    {{- if and .Values.sinks.clickhouse.enabled (not .Values.sinks.clickhouse.bundled.enabled) }}{{ $external = append $external $np.egress.clickhouse }}{{ end -}}
    {{- if and .Values.sinks.opensearch.enabled (not .Values.opensearch.enabled) }}{{ $external = append $external $np.egress.opensearch }}{{ end -}}
    {{- range $external }}
    - to:
        {{- toYaml .to | nindent 8 }}
      ports:
        {{- range .ports }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
    {{- end }}
    {{- with $np.egress.extraRules }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}
{{- if and $np.storage $bundled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-storage
  labels:
    {{- include "fastproof.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          {{- toYaml $bundled | nindent 10 }}
      - key: cnpg.io/cluster
        operator: DoesNotExist
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "fastproof.name" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: ["server", "migrate"]
{{- end }}
{{- if and $np.storage $streaming }}
{{- range $streaming }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-{{ .name }}
  labels:
    {{- include "fastproof.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .name }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "fastproof.name" $ }}
              app.kubernetes.io/instance: {{ $.Release.Name }}
              app.kubernetes.io/component: server
      ports:
        - port: {{ .port }}
          protocol: TCP
    {{- if .self }}
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .name }}
              app.kubernetes.io/instance: {{ $.Release.Name }}
    {{- end }}
{{- end }}
{{- end }}
