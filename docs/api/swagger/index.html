<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FastProof API</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/brand/favicon.svg">
  <link rel="stylesheet" href="../../stylesheets/fonts.css">
  <link rel="stylesheet" href="vendor/swagger-ui.css">
  <style>
    body { margin: 0; background: #fff; color: #24162f; }
    .fp-bar { display: flex; gap: 16px; align-items: center; padding: 12px 16px; font: 14px "Noto Sans", system-ui, sans-serif; background: #ffd43b; border-bottom: 1px solid #e8b800; }
    .fp-bar img { height: 20px; width: auto; }
    .fp-bar a { color: #24162f; text-decoration: underline; text-underline-offset: 3px; }
    .swagger-ui { font-family: "Noto Sans", system-ui, sans-serif; }
    .swagger-ui .info a { color: #6020a0; }
    .swagger-ui .opblock.opblock-get { background: #dfeee5; border-color: #347750; }
    .swagger-ui .opblock.opblock-get .opblock-summary-method { background: #347750; }
    .swagger-ui .opblock.opblock-post { background: #e2eff8; border-color: #34709b; }
    .swagger-ui .opblock.opblock-post .opblock-summary-method { background: #34709b; }
    .swagger-ui .opblock.opblock-put { background: #eee5f6; border-color: #765198; }
    .swagger-ui .opblock.opblock-put .opblock-summary-method { background: #765198; }
    .swagger-ui .opblock.opblock-patch { background: #f5e7d5; border-color: #9b621e; }
    .swagger-ui .opblock.opblock-patch .opblock-summary-method { background: #9b621e; }
    .swagger-ui .opblock.opblock-delete { background: #f8e1dc; border-color: #af4a40; }
    .swagger-ui .opblock.opblock-delete .opblock-summary-method { background: #af4a40; }
    .swagger-ui .opblock.opblock-head { background: #ede7e2; border-color: #75645c; }
    .swagger-ui .opblock.opblock-head .opblock-summary-method { background: #75645c; }
    .swagger-ui .opblock.opblock-options { background: #ddecec; border-color: #46777e; }
    .swagger-ui .opblock.opblock-options .opblock-summary-method { background: #46777e; }
  </style>
</head>
<body>
  <div class="fp-bar"><img src="../../assets/brand/FransHub_monogram_mono_dark.svg" alt=""><strong>FastProof API</strong><a href="../../">Documentation</a><a href="../openapi.json">openapi.json</a></div>
  <div id="swagger-ui"></div>
  <script src="vendor/swagger-ui-bundle.js"></script>
  <script src="swagger-init.js"></script>
</body>
</html>
