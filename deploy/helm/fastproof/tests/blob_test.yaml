suite: blob storage defaults
templates:
  - templates/configmap.yaml
  - templates/garage.yaml
  - templates/deployment.yaml
  - templates/NOTES.txt
  - templates/secrets.yaml
  - templates/networkpolicy.yaml
release:
  name: fp
  namespace: qa
set:
  database.existingSecret: db
  auth.adminTokens.generate: true
tests:
  - it: stores attachments in the bundled Garage by default
    template: templates/configmap.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: data.FASTPROOF_BLOB_BACKEND
          value: s3
      - equal:
          path: data.FASTPROOF_S3_ENDPOINT
          value: http://fp-garage:3900
      - equal:
          path: data.FASTPROOF_MEDIA_URL_TTL_SECONDS
          value: "300"
      - notExists:
          path: data.FASTPROOF_BLOB_DIR

  - it: renders the bundled Garage by default
    template: templates/garage.yaml
    documentIndex: 3
    asserts:
      - isKind:
          of: StatefulSet

  - it: sets the media URL lifetime
    template: templates/configmap.yaml
    documentIndex: 0
    set:
      server.mediaUrlTtlSeconds: 120
    asserts:
      - equal:
          path: data.FASTPROOF_MEDIA_URL_TTL_SECONDS
          value: "120"

  - it: uses an external S3 endpoint instead of Garage when one is set
    set:
      blob.s3.endpoint: https://s3.example.com
      blob.s3.bucket: reports
      blob.s3.credentials.existingSecret: s3-creds
    asserts:
      - equal:
          path: data.FASTPROOF_BLOB_BACKEND
          value: s3
        template: templates/configmap.yaml
        documentIndex: 0
      - equal:
          path: data.FASTPROOF_S3_ENDPOINT
          value: https://s3.example.com
        template: templates/configmap.yaml
        documentIndex: 0
      - hasDocuments:
          count: 0
        template: templates/garage.yaml

  - it: keeps the filesystem when it is chosen explicitly
    set:
      blob.backend: fs
    asserts:
      - equal:
          path: data.FASTPROOF_BLOB_BACKEND
          value: fs
        template: templates/configmap.yaml
        documentIndex: 0
      - equal:
          path: data.FASTPROOF_BLOB_DIR
          value: /var/lib/fastproof/blobs
        template: templates/configmap.yaml
        documentIndex: 0
      - hasDocuments:
          count: 0
        template: templates/garage.yaml

  - it: upgrades with the filesystem when it is stated
    release:
      name: fp
      namespace: qa
      revision: 2
      upgrade: true
    set:
      blob.backend: fs
    template: templates/configmap.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: data.FASTPROOF_BLOB_BACKEND
          value: fs

  - it: upgrades to S3 when it is stated
    release:
      name: fp
      namespace: qa
      revision: 2
      upgrade: true
    set:
      blob.backend: s3
    template: templates/configmap.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: data.FASTPROOF_BLOB_BACKEND
          value: s3

  - it: needs an endpoint when Garage is off
    set:
      blob.backend: s3
      garage.enabled: false
    template: templates/deployment.yaml
    asserts:
      - failedTemplate:
          errorPattern: "blob.s3.endpoint is required"

  - it: describes Garage in the notes
    template: templates/NOTES.txt
    asserts:
      - matchRegexRaw:
          pattern: 'bundled single-node Garage'

  - it: creates the media signing secret once and keeps it
    template: templates/secrets.yaml
    documentSelector:
      path: metadata.name
      value: fp-fastproof-media-key
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
      - exists:
          path: data.media-url-key

  - it: uses an existing secret for the media key
    template: templates/secrets.yaml
    set:
      server.mediaUrlKey.existingSecret: my-media-key
    asserts:
      - hasDocuments:
          count: 2

  - it: sets the media limits and the key file
    template: templates/configmap.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: data.FASTPROOF_MEDIA_MAX_STREAMS
          value: "256"
      - equal:
          path: data.FASTPROOF_MEDIA_STREAM_TIMEOUT_SECONDS
          value: "60"
      - equal:
          path: data.FASTPROOF_MEDIA_URL_KEY_FILE
          value: /etc/fastproof/secrets/media-url-key
      - notExists:
          path: data.FASTPROOF_BLOB_BACKEND_MIGRATED

  - it: passes the migrated flag
    template: templates/configmap.yaml
    documentIndex: 0
    set:
      server.blobBackendMigrated: true
    asserts:
      - equal:
          path: data.FASTPROOF_BLOB_BACKEND_MIGRATED
          value: "true"

  - it: keeps the filesystem volume out of pruning
    template: templates/deployment.yaml
    set:
      blob.backend: fs
    documentSelector:
      path: kind
      value: PersistentVolumeClaim
    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-options"]
          value: Prune=false
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep

  - it: lets only the S3 port of Garage through
    template: templates/networkpolicy.yaml
    documentSelector:
      path: metadata.name
      value: fp-fastproof-garage
    asserts:
      - equal:
          path: spec.ingress[0].ports[0].port
          value: 3900
      - lengthEqual:
          path: spec.ingress[0].ports
          count: 1
